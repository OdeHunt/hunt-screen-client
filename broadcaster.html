<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HUNT SCREEN</title>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #000;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .container {

      width: min(1000px, 92%);

      text-align: center;

    }

    .logo {

      color: #ff8c00;

      font-size: 52px;

      font-weight: 900;

      letter-spacing: 10px;

    }

    .subtitle {

      color: #666;

      font-size: 13px;

      letter-spacing: 8px;

      margin-bottom: 30px;

    }

    .preview-box {

      width: 100%;

      background: #080808;

      border: 1px solid #222;

      border-radius: 10px;

      overflow: hidden;

      min-height: 250px;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    video {

      width: 100%;

      max-height: 560px;

      display: block;

      background: #000;

    }

    .empty-preview {

      color: #333;

      font-size: 13px;

      letter-spacing: 2px;

      padding: 100px 20px;

    }

    .controls {

      margin-top: 20px;

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

    }

    button {

      padding: 14px 24px;

      border: 0;

      border-radius: 7px;

      background: #ff8c00;

      color: #000;

      font-weight: 900;

      cursor: pointer;

      font-size: 14px;

    }

    button:hover {

      filter: brightness(1.15);

    }

    button:disabled {

      opacity: 0.45;

      cursor: not-allowed;

    }

    .stop {

      background: #222;

      color: #fff;

      display: none;

    }

    .back-container {

      margin-top: 18px;

      display: flex;

      justify-content: center;

    }

    .back-button {

      padding: 11px 20px;

      border: 1px solid #333;

      border-radius: 7px;

      background: #111;

      color: #fff;

      font-weight: 900;

      cursor: pointer;

      font-size: 13px;

    }

    .back-button:hover {

      background: #1c1c1c;

      border-color: #555;

      filter: none;

    }

    .settings {

      margin-top: 18px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

    }

    select {

      background: #111;

      color: #fff;

      border: 1px solid #333;

      border-radius: 6px;

      padding: 10px 14px;

      outline: none;

    }

    .label {

      color: #777;

      font-size: 12px;

    }

    .status {

      margin-top: 18px;

      color: #777;

      font-size: 12px;

      letter-spacing: 2px;

    }

    .status.live {

      color: #ff8c00;

    }

    .info {

      margin-top: 20px;

      color: #444;

      font-size: 11px;

      letter-spacing: 1px;

    }

    .error {

      margin-top: 10px;

      color: #ff5555;

      font-size: 12px;

      display: none;

    }

  </style>

</head>


<body>

  <div class="container">


    <div class="logo">
      HUNT
    </div>


    <div class="subtitle">
      SCREEN
    </div>


    <div class="preview-box">

      <video
        id="preview"
        autoplay
        muted
        playsinline>
      </video>

      <div
        id="emptyPreview"
        class="empty-preview">

        NENHUMA TELA SELECIONADA

      </div>

    </div>


    <div class="settings">

      <span class="label">
        QUALIDADE
      </span>


      <select id="quality">

        <option value="720">
          720p
        </option>

        <option
          value="1080"
          selected>
          1080p
        </option>

        <option value="1440">
          1440p
        </option>

      </select>


      <span class="label">
        FPS
      </span>


      <select id="fps">

        <option value="30">
          30 FPS
        </option>

        <option
          value="60"
          selected>
          60 FPS
        </option>

      </select>

    </div>


    <div class="controls">

      <button id="chooseButton">

        📺 ESCOLHER TELA

      </button>


      <button
        id="startButton"
        style="display:none">

        ▶ COMEÇAR TRANSMISSÃO

      </button>


      <button
        id="stopButton"
        class="stop">

        ⏹ PARAR TRANSMISSÃO

      </button>

    </div>


    <div class="back-container">

      <button
        id="backButton"
        class="back-button">

        ← VOLTAR

      </button>

    </div>


    <div
      id="status"
      class="status">

      CONECTANDO...

    </div>


    <div
      id="error"
      class="error">
    </div>


    <div class="info">

      HUNT SCREEN • TRANSMISSÃO

    </div>

  </div>


<script>

/* ==================================================
   CONFIGURAÇÃO
================================================== */

const SERVER_URL =
  "https://hunt-screen-server.onrender.com";

const ROOM_ID =
  "hunt-screen-main";


/* ==================================================
   ELEMENTOS
================================================== */

const preview =
  document.getElementById(
    "preview"
  );

const emptyPreview =
  document.getElementById(
    "emptyPreview"
  );

const chooseButton =
  document.getElementById(
    "chooseButton"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const status =
  document.getElementById(
    "status"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const quality =
  document.getElementById(
    "quality"
  );

const fps =
  document.getElementById(
    "fps"
  );


/* ==================================================
   EVENTOS DOS BOTÕES

   IMPORTANTE:
   Nada de onclick no HTML.
   Isso evita bloqueio da CSP do Discord.
================================================== */

chooseButton.addEventListener(
  "click",
  chooseScreen
);

startButton.addEventListener(
  "click",
  startTransmission
);

stopButton.addEventListener(
  "click",
  stopTransmission
);

backButton.addEventListener(
  "click",
  goBack
);


/* ==================================================
   VARIÁVEIS
================================================== */

let socket = null;

let screenStream = null;

let transmitting = false;

const peers = new Map();


/* ==================================================
   WEBRTC
================================================== */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    }

  ]

};


/* ==================================================
   DISCORD ACTIVITY
================================================== */

const isDiscordActivity =
  window.location.hostname
    .endsWith(
      ".discordsays.com"
    );


console.log(
  "HUNT: Discord Activity:",
  isDiscordActivity
);


/* ==================================================
   DISCORD URL MAPPING
================================================== */

async function setupDiscord() {

  if (!isDiscordActivity) {

    console.log(
      "HUNT: navegador normal"
    );

    return;

  }


  console.log(
    "HUNT: configurando Discord..."
  );


  try {

    /*
     * O Discord Activity possui um proxy
     * para URLs externas.
     *
     * O /hunt-socket será encaminhado
     * para o servidor HUNT.
     */

    if (
      window.DiscordSDK &&
      typeof window.DiscordSDK.patchUrlMappings ===
        "function"
    ) {

      window.DiscordSDK.patchUrlMappings([

        {

          prefix:
            "/hunt-socket",

          target:
            "hunt-screen-server.onrender.com"

        }

      ]);


      console.log(
        "HUNT: URL Mapping configurado"
      );

    }

    else {

      console.warn(
        "HUNT: DiscordSDK.patchUrlMappings não disponível"
      );

    }

  }

  catch (error) {

    console.error(
      "HUNT: erro no Discord URL Mapping:",
      error
    );

  }

}


/* ==================================================
   CONECTAR SOCKET
================================================== */

async function connectSocket() {

  await setupDiscord();


  console.log(
    "HUNT: iniciando Socket.IO..."
  );


  /*
   * Navegador normal:
   *
   * https://hunt-screen-server.onrender.com
   *
   *
   * Discord:
   *
   * https://xxxx.discordsays.com
   *
   * usando /hunt-socket
   */

  const socketURL =
    isDiscordActivity
      ? window.location.origin
      : SERVER_URL;


  console.log(
    "HUNT: Socket URL:",
    socketURL
  );


  socket =
    io(
      socketURL,
      {

        path:
          "/hunt-socket",

        /*
         * Começamos com polling.
         *
         * Depois o Socket.IO tenta
         * atualizar para WebSocket.
         *
         * Isso é mais compatível com
         * o proxy do Discord.
         */

        transports:
          [
            "polling",
            "websocket"
          ],

        reconnection:
          true,

        reconnectionAttempts:
          Infinity,

        reconnectionDelay:
          1000,

        reconnectionDelayMax:
          5000,

        timeout:
          20000

      }
    );


  /* ==================================================
     CONECTADO
  ================================================== */

  socket.on(
    "connect",
    () => {

      console.log(
        "HUNT SERVER conectado:",
        socket.id
      );


      status.textContent =
        "● ONLINE";


      status.classList.remove(
        "live"
      );


      hideError();


      socket.emit(
        "join-room",
        ROOM_ID
      );

    }
  );


  /* ==================================================
     ERRO
  ================================================== */

  socket.on(
    "connect_error",
    error => {

      console.error(
        "HUNT: erro de conexão:",
        error
      );


      console.error(
        "HUNT: detalhes do erro:",
        {

          message:
            error.message,

          description:
            error.description,

          context:
            error.context,

          type:
            error.type

        }
      );


      status.textContent =
        "● ERRO DE CONEXÃO";


      showError(
        "Não foi possível conectar ao servidor."
      );

    }
  );


  /* ==================================================
     DESCONECTADO
  ================================================== */

  socket.on(
    "disconnect",
    reason => {

      console.warn(
        "HUNT: desconectado:",
        reason
      );


      if (!transmitting) {

        status.textContent =
          "● DESCONECTADO";

      }

    }
  );


  /* ==================================================
     NOVO ESPECTADOR
  ================================================== */

  socket.on(
    "user-joined",
    async data => {

      console.log(
        "HUNT: novo espectador:",
        data
      );


      if (!transmitting) {

        return;

      }


      if (
        !data ||
        !data.socketId
      ) {

        return;

      }


      await createOffer(
        data.socketId
      );

    }
  );


  /* ==================================================
     ANSWER
  ================================================== */

  socket.on(
    "webrtc-answer",
    async data => {

      console.log(
        "HUNT: ANSWER recebida:",
        data
      );


      if (
        !data ||
        !data.sender ||
        !data.answer
      ) {

        return;

      }


      const peer =
        peers.get(
          data.sender
        );


      if (!peer) {

        console.warn(
          "HUNT: Peer não encontrado:",
          data.sender
        );

        return;

      }


      try {

        await peer.setRemoteDescription(
          data.answer
        );


        console.log(
          "HUNT: ANSWER aplicada"
        );

      }

      catch (error) {

        console.error(
          "HUNT: erro aplicando ANSWER:",
          error
        );

      }

    }
  );


  /* ==================================================
     ICE
  ================================================== */

  socket.on(
    "webrtc-ice-candidate",
    async data => {

      if (
        !data ||
        !data.sender ||
        !data.candidate
      ) {

        return;

      }


      const peer =
        peers.get(
          data.sender
        );


      if (!peer) {

        return;

      }


      try {

        await peer.addIceCandidate(
          data.candidate
        );


        console.log(
          "HUNT: ICE aplicado:",
          data.sender
        );

      }

      catch (error) {

        console.error(
          "HUNT: erro ICE:",
          error
        );

      }

    }
  );


  /* ==================================================
     STREAM STOPPED
  ================================================== */

  socket.on(
    "stream-stopped",
    data => {

      console.log(
        "HUNT: transmissão encerrada:",
        data
      );

    }
  );

}


/* ==================================================
   ESCOLHER TELA
================================================== */

async function chooseScreen() {

  hideError();


  try {

    const selectedFPS =
      Number(
        fps.value
      );


    screenStream =
      await navigator
        .mediaDevices
        .getDisplayMedia({

          video: {

            frameRate: {

              ideal:
                selectedFPS,

              max:
                selectedFPS

            }

          },

          audio: true

        });


    preview.srcObject =
      screenStream;


    emptyPreview.style.display =
      "none";


    chooseButton.style.display =
      "none";


    startButton.style.display =
      "inline-block";


    stopButton.style.display =
      "none";


    status.textContent =
      "● TELA SELECIONADA";


    status.classList.remove(
      "live"
    );


    const track =
      screenStream
        .getVideoTracks()[0];


    if (track) {

      track.addEventListener(
        "ended",
        () => {

          stopTransmission();

        }
      );

    }

  }

  catch (error) {

    console.error(
      "HUNT: erro ao capturar tela:",
      error
    );


    showError(
      "A captura da tela foi cancelada."
    );

  }

}


/* ==================================================
   INICIAR TRANSMISSÃO
================================================== */

function startTransmission() {

  if (!screenStream) {

    showError(
      "Escolha uma tela primeiro."
    );

    return;

  }


  if (
    !socket ||
    !socket.connected
  ) {

    showError(
      "Servidor não conectado."
    );

    return;

  }


  if (transmitting) {

    return;

  }


  transmitting =
    true;


  status.textContent =
    "🔴 TRANSMITINDO";


  status.classList.add(
    "live"
  );


  startButton.style.display =
    "none";


  stopButton.style.display =
    "inline-block";


  socket.emit(
    "start-stream",
    {

      roomId:
        ROOM_ID

    }
  );


  console.log(
    "HUNT: transmissão iniciada"
  );

}


/* ==================================================
   CRIAR PEER
================================================== */

function createPeer(
  viewerId
) {

  console.log(
    "HUNT: criando PeerConnection:",
    viewerId
  );


  /*
   * Verificação importante.
   */

  if (
    typeof RTCPeerConnection !==
    "function"
  ) {

    console.error(
      "HUNT: RTCPeerConnection não está disponível."
    );


    showError(
      "WebRTC não está disponível neste ambiente."
    );


    return null;

  }


  const peer =
    new RTCPeerConnection(
      rtcConfig
    );


  /* ==================================================
     ADICIONAR TELA
  ================================================== */

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => {

          peer.addTrack(
            track,
            screenStream
          );

        }
      );

  }


  /* ==================================================
     ICE
  ================================================== */

  peer.onicecandidate =
    event => {

      if (
        event.candidate &&
        socket &&
        socket.connected
      ) {

        socket.emit(
          "webrtc-ice-candidate",
          {

            target:
              viewerId,

            candidate:
              event.candidate

          }
        );

      }

    };


  /* ==================================================
     ESTADO
  ================================================== */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "HUNT: WebRTC:",
        viewerId,
        peer.connectionState
      );


      if (
        peer.connectionState ===
        "failed" ||

        peer.connectionState ===
        "closed" ||

        peer.connectionState ===
        "disconnected"
      ) {

        peers.delete(
          viewerId
        );

      }

    };


  peers.set(
    viewerId,
    peer
  );


  return peer;

}


/* ==================================================
   CRIAR OFFER
================================================== */

async function createOffer(
  viewerId
) {

  console.log(
    "HUNT: criando OFFER:",
    viewerId
  );


  try {

    const peer =
      createPeer(
        viewerId
      );


    if (!peer) {

      return;

    }


    const offer =
      await peer.createOffer();


    await peer.setLocalDescription(
      offer
    );


    socket.emit(
      "webrtc-offer",
      {

        target:
          viewerId,

        offer:
          peer.localDescription

      }
    );


    console.log(
      "HUNT: OFFER enviada:",
      viewerId
    );

  }

  catch (error) {

    console.error(
      "HUNT: erro criando OFFER:",
      error
    );

  }

}


/* ==================================================
   PARAR TRANSMISSÃO
================================================== */

function stopTransmission() {

  console.log(
    "HUNT: parando transmissão..."
  );


  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => {

          try {

            track.stop();

          }

          catch (error) {

            console.warn(
              "HUNT: erro parando track:",
              error
            );

          }

        }
      );

  }


  screenStream =
    null;


  preview.srcObject =
    null;


  emptyPreview.style.display =
    "block";


  transmitting =
    false;


  /* ==================================================
     FECHAR PEERS
  ================================================== */

  for (
    const peer
    of peers.values()
  ) {

    try {

      peer.close();

    }

    catch (error) {

      console.warn(
        "HUNT: erro fechando peer:",
        error
      );

    }

  }


  peers.clear();


  /* ==================================================
     AVISAR SERVIDOR
  ================================================== */

  if (
    socket &&
    socket.connected
  ) {

    socket.emit(
      "stop-stream",
      {

        roomId:
          ROOM_ID

      }
    );

  }


  resetInterface();

}


/* ==================================================
   RESET
================================================== */

function resetInterface() {

  chooseButton.style.display =
    "inline-block";


  startButton.style.display =
    "none";


  stopButton.style.display =
    "none";


  status.textContent =
    "● ONLINE";


  status.classList.remove(
    "live"
  );

}


/* ==================================================
   VOLTAR
================================================== */

function goBack() {

  console.log(
    "HUNT: voltando..."
  );


  /*
   * Se estiver transmitindo,
   * encerra antes de voltar.
   */

  if (transmitting) {

    stopTransmission();

  }


  /*
   * Volta para a página inicial
   * do HUNT SCREEN.
   */

  window.location.href =
    "/";

}


/* ==================================================
   ERROS
================================================== */

function showError(
  message
) {

  errorBox.textContent =
    message;


  errorBox.style.display =
    "block";

}


function hideError() {

  errorBox.textContent =
    "";


  errorBox.style.display =
    "none";

}


/* ==================================================
   INICIALIZAÇÃO
================================================== */

console.log(
  "HUNT: broadcaster iniciando..."
);


connectSocket();


</script>

</body>

</html>
