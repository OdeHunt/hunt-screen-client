<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>HUNT SCREEN • TRANSMISSOR</title>

</head>


<body>

  <main class="container">

    <header class="header">

      <div class="logo">
        HUNT
      </div>

      <div class="subtitle">
        SCREEN
      </div>

    </header>


    <section class="preview-box">

      <video
        id="preview"
        autoplay
        muted
        playsinline>
      </video>

      <div
        id="emptyPreview"
        class="empty-preview">

        NENHUMA TELA SELECIONADA

      </div>

    </section>


    <section class="settings">

      <div class="setting">

        <span>
          QUALIDADE
        </span>

        <select id="quality">

          <option value="360">
            360p
          </option>

          <option value="480">
            480p
          </option>

          <option value="720">
            720p
          </option>

          <option
            value="1080"
            selected>
            1080p
          </option>

        </select>

      </div>


      <div class="setting">

        <span>
          FPS
        </span>

        <select id="fps">

          <option value="30">
            30 FPS
          </option>

          <option
            value="60"
            selected>
            60 FPS
          </option>

        </select>

      </div>

    </section>


    <section class="controls">

      <button
        id="chooseButton"
        class="primary"
        type="button">

        📺 ESCOLHER TELA

      </button>


      <button
        id="startButton"
        class="primary hidden"
        type="button">

        ▶ COMEÇAR TRANSMISSÃO

      </button>


      <button
        id="stopButton"
        class="danger hidden"
        type="button">

        ⏹ PARAR TRANSMISSÃO

      </button>


      <button
        id="backButton"
        class="secondary"
        type="button">

        ← VOLTAR

      </button>

    </section>


    <div
      id="status"
      class="status">

      CONECTANDO...

    </div>


    <div
      id="error"
      class="error"
      role="alert"
      aria-live="polite">
    </div>


    <div class="info">

      HUNT SCREEN • TRANSMISSOR

    </div>

  </main>


  <script
    type="module"
    src="/src/broadcaster.js">
  </script>

</body>

</html>
